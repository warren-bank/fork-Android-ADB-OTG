apply from: '../constants.gradle'
apply plugin: 'com.android.application'

android {
  namespace project.ext.applicationId

  compileSdkVersion project.ext.compileSdkVersion
  buildToolsVersion project.ext.buildToolsVersion

  compileOptions {
    sourceCompatibility project.ext.javaVersion
    targetCompatibility project.ext.javaVersion
  }

  defaultConfig {
    minSdkVersion    project.ext.minSdkVersion
    targetSdkVersion project.ext.targetSdkVersion

    applicationId project.ext.applicationId
    versionName   project.ext.releaseVersion
    versionCode   project.ext.releaseVersionCode

    archivesBaseName += "-$versionName"
  }

  buildTypes {
    release {
      debuggable      false
      jniDebuggable   false
      shrinkResources true
      minifyEnabled   true
      proguardFiles = [
        "proguard-rules.txt",
        getDefaultProguardFile('proguard-android.txt')
      ]
    }
    debug {
      debuggable      true
      jniDebuggable   true
      shrinkResources false
      minifyEnabled   false
    }
  }

  dependenciesInfo {
    includeInApk    = false  // Disables dependency metadata when building APKs.
    includeInBundle = false  // Disables dependency metadata when building Android App Bundles.
  }

  lintOptions {
    disable 'Instantiatable'
    disable 'MissingTranslation'
    abortOnError true
  }
}

dependencies {
  implementation project(':adblib')

  implementation 'androidx.appcompat:appcompat:1.6.1'
  implementation 'androidx.cardview:cardview:1.0.0'
  implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
  implementation 'com.github.bumptech.glide:glide:4.15.1'

/* ==============
 * not available:
 * https://mvnrepository.com/artifact/com.github.smarteist/autoimageslider
 * ==============
  implementation 'com.github.smarteist:autoimageslider:1.3.9'
**/

/* =======
 * mirror:
 * https://mvnrepository.com/artifact/com.github.smarteist/Android-Image-Slider
 * =======
**/
  implementation 'com.github.smarteist:Android-Image-Slider:1.3.9'

  annotationProcessor 'com.github.bumptech.glide:compiler:4.13.0'
}
